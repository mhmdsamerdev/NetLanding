name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv run --extra dev pytest -q
      - name: Committed frontend build is up to date
        run: |
          uv run python -c "import sys; from netlanding import frontend_build as f; sys.exit('static is stale - run npm run build in frontend' if f.is_stale() else 0)"
